<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SismoWatch Enterprise - SuperApp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdf4',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b'
              }
            }
          }
        }
      }
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom Red Seismic Location Pin & Pulse */
      @keyframes sismoRadarPing {
        0% { transform: scale(0.85); opacity: 0.95; }
        70% { transform: scale(2.8); opacity: 0.15; }
        100% { transform: scale(3.4); opacity: 0; }
      }
      .sismo-red-pulse {
        animation: sismoRadarPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: center center;
      }
      /* Dark Theme Leaflet Popups */
      .leaflet-popup-content-wrapper {
        background-color: #0f172a !important;
        color: #f8fafc !important;
        border-radius: 12px !important;
        border: 1px solid #334155 !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
      }
      .leaflet-popup-tip {
        background-color: #0f172a !important;
        border: 1px solid #334155 !important;
      }
      .leaflet-container {
        font-family: 'Inter', sans-serif !important;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
